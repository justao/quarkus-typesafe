# Gradle properties

quarkusPluginId=io.quarkus
quarkusPluginVersion=3.39.5
quarkusPlatformGroupId=io.quarkus.platform
quarkusPlatformArtifactId=quarkus-bom
quarkusPlatformVersion=3.39.5

# Java release the library is compiled for. The reference typesafe-java-sdk targets 17 and
# Quarkus requires at least 17, so 17 is the baseline an application consuming this library
# has to meet.
javaVersion=17

# Version of the reference SDK the extension is built against. It is a SNAPSHOT that has to
# be installed locally first; see the installTypeSafeSdk task in the root build.
typesafeSdkVersion=0.3.0-SNAPSHOT
