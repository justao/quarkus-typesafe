## A basic GitHub Actions workflow for the quarkus-typesafe library.

name: CI build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # The client this extension wires up is the reference typesafe-java-sdk, which is not
      # published yet. It is built from its own repository and installed into the local Maven
      # repository, which every module here resolves from. The reference checkout is not
      # committed to this repository, so CI fetches it.
      - name: Check out the reference TypeSafe SDK
        uses: actions/checkout@v5
        with:
          repository: spring-ai-community/spring-ai-typesafe
          path: spring-ai-typesafe

      - name: Install typesafe-java-sdk into the local Maven repository
        run: ./gradlew installTypeSafeSdk

      - name: Build and test
        run: ./gradlew build
