# Every key this application reads comes from the extension. Nothing is set here on
# purpose: the application starts without an API key, and the tests that need a client
# supply one through a QuarkusTestProfile.
#
# quarkus.typesafe.api-key=${TYPESAFE_API_KEY}
# quarkus.typesafe.base-url=https://api.typesafe.ai
# quarkus.typesafe.model=jev-latest
# quarkus.typesafe.timeout=10s
# quarkus.typesafe.retry.max-retries=2
# quarkus.typesafe.retry.initial-backoff=500ms
# quarkus.typesafe.retry.max-backoff=5s
# quarkus.typesafe.retry.jitter=0.25
# quarkus.typesafe.retry.statuses=408,429
# quarkus.typesafe.retry.respect-retry-after=true
# quarkus.typesafe.retry.retry-connection-errors=true
# quarkus.typesafe.retry.total-timeout=30s
